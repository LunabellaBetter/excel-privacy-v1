name: Windows x64 native acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-test.txt
      - name: Verify source and run regressions
        run: |
          python privacy_app.py --verify-self
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_release_tests.py
      - name: Collect native dependency notices
        run: python tools/collect_licenses.py
      - name: Native x64 build
        run: python -m PyInstaller --noconfirm --clean "Excel Privacy Tool Windows.spec"
      - name: Verify system runtime prerequisite and excluded Microsoft binaries
        shell: pwsh
        run: |
          $runtime = Get-Item "$env:WINDIR/System32/vcruntime140.dll" -ErrorAction Stop
          $forbidden = @(Get-ChildItem "dist/Excel Privacy Tool" -Recurse -Filter *.dll | Where-Object { $_.Name -match '^(VCRUNTIME140(_1)?\.dll|ucrtbase\.dll|api-ms-win-.*)$' })
          if ($forbidden.Count -ne 0) { throw "Microsoft runtime DLLs unexpectedly bundled" }
          @{ official_system_runtime_present=$true; vc_runtime_version=$runtime.VersionInfo.FileVersion; microsoft_runtime_dlls_bundled=$false; os_version=[Environment]::OSVersion.VersionString } | ConvertTo-Json | Out-File docs/evidence/windows-system-runtime.json -Encoding utf8
      - name: Fresh-process frozen acceptance with Chinese paths
        shell: pwsh
        run: |
          python tools/release_smoke.py --app "dist/Excel Privacy Tool/Excel Privacy Tool.exe" --work-dir "$env:RUNNER_TEMP/中文验收/Excel Privacy"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/中文验收/Excel Privacy/acceptance.json" docs/evidence/windows-frozen.json
      - name: Package portable ZIP and SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item README.md "dist/Excel Privacy Tool/README.md"
          Copy-Item release/EXCEL_2016_ACCEPTANCE.md "dist/Excel Privacy Tool/EXCEL_2016_ACCEPTANCE.md"
          Copy-Item "$env:RUNNER_TEMP/中文验收/Excel Privacy/原始合成资料/复杂 HR 验收.xlsx" "dist/Excel Privacy Tool/SYNTHETIC_HR.xlsx"
          Compress-Archive -Path "dist/Excel Privacy Tool" -DestinationPath artifacts/Excel-Privacy-1.0.0-windows-x64.zip
          $hash = (Get-FileHash artifacts/Excel-Privacy-1.0.0-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Excel-Privacy-1.0.0-windows-x64.zip" | Out-File artifacts/SHA256SUMS.txt -Encoding ascii
          Copy-Item docs/evidence/windows-frozen.json artifacts/
          Copy-Item release/licenses/inventory.json artifacts/windows-dependencies.json
          Copy-Item docs/evidence/windows-system-runtime.json artifacts/
      - name: Save private build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-candidate
          path: |
            artifacts/
            docs/evidence/pytest-core.xml
            docs/evidence/pytest-gui-isolated.json
          if-no-files-found: error
          retention-days: 14
